services:
  gateway:
    build:
      context: ./go-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ML_SERVICE_URL: "http://ml-service:8000"
      REDIS_URL: "redis:6379"
      # Interpolated from shell or repo-root .env (Compose); must match clients' Bearer token.
      API_KEY: ${API_KEY}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      ml-service:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./ml-service/model:/app/model
      - ./ml-service/app:/app/app        

    env_file:
      - .env
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_API_KEY=qdrant
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  qdrant_data:
  redis_data:
  